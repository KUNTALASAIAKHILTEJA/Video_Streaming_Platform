components:
  schemas:
    Episode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        season:
          type: integer
        episode_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        video_file:
          type: string
          format: uri
          nullable: true
        genre_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
          readOnly: true
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Duration in minutes
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - episode_number
      - genres
      - id
      - season
      - title
      - updated_at
    Genre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - id
      - name
      - slug
    PaginatedEpisodeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
    PaginatedGenreList:
      type: object
